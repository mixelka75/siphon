<svg xmlns="http://www.w3.org/2000/svg" width="660" height="420" viewBox="0 0 660 420">
  <!-- Фон окна установочного DMG. Иконки Finder ставит по центрам (180, 196) и (480, 196),
       см. dmg-settings.py. После правок: packaging/macos/render-background.sh
       Светлый фон не случайно: подписи под иконками Finder на картинке всегда рисует чёрным.
       Окно показывает 660×400 (на macOS 26+), нижние 20 pt — запас для систем с более низким
       заголовком окна, поэтому строка состояния тянется до самого низа. -->
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="1" fill="#121212" fill-opacity="0.09"/>
    </pattern>
    <radialGradient id="fade" cx="50%" cy="48%" r="62%">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="fadeMask"><rect width="660" height="370" fill="url(#fade)"/></mask>
  </defs>

  <rect width="660" height="420" fill="#f6f5f1"/>
  <rect width="660" height="370" fill="url(#dots)" mask="url(#fadeMask)"/>

  <!-- шапка -->
  <text x="34" y="56" font-family="Roboto Flex" font-size="30" font-weight="850" font-stretch="expanded"
        letter-spacing="-1.3" fill="#121212">siphon<tspan fill="#ff4f1a">.</tspan></text>
  <text x="626" y="52" text-anchor="end" font-family="JetBrains Mono" font-size="10" font-weight="600"
        letter-spacing="1.2" fill="#64625c">HTTP(S) · ANDROID · FRIDA</text>
  <line x1="34" y1="78" x2="626" y2="78" stroke="#121212" stroke-opacity="0.12"/>

  <!-- место назначения -->
  <rect x="398" y="112" width="164" height="190" rx="10" fill="#121212" fill-opacity="0.03"
        stroke="#121212" stroke-opacity="0.28" stroke-dasharray="6 5"/>

  <!-- поток: из приложения в «Программы» -->
  <g stroke="#ff4f1a" stroke-width="6" fill="none">
    <path d="M268 196h96" stroke-dasharray="12 8"/>
    <path d="M370 182l16 14-16 14" stroke-linecap="square" stroke-linejoin="miter"/>
  </g>

  <!-- подсказка -->
  <text x="330" y="338" text-anchor="middle" font-family="Roboto Flex" font-size="15" font-weight="650"
        fill="#121212">Перетащите Siphon в «Программы»</text>

  <!-- строка состояния, как в приложении -->
  <rect y="370" width="660" height="50" fill="#f6f5f1"/>
  <line x1="0" y1="370.5" x2="660" y2="370.5" stroke="#121212" stroke-opacity="0.28"/>
  <rect y="371" width="92" height="49" fill="#ff4f1a"/>
  <text x="46" y="389" text-anchor="middle" font-family="JetBrains Mono" font-size="10" font-weight="700"
        letter-spacing="1" fill="#121212">INSTALL</text>
  <text x="108" y="389" font-family="JetBrains Mono" font-size="10" font-weight="600" letter-spacing="1"
        fill="#64625c">DRAG TO APPLICATIONS <tspan fill="#ff4f1a">✱</tspan> WORKS ON MY PHONE <tspan fill="#ff4f1a">✱</tspan> MXL.WTF</text>
</svg>
