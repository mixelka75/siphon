name: Build & Release

# Каждый push/PR собирает приложения под три платформы и кладёт их в артефакты.
# Тег вида v1.2.3 дополнительно публикует GitHub Release со всеми сборками.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: '1.27.3'
  NODE_VERSION: '22'
  WAILS: github.com/wailsapp/wails/v2/cmd/wails@v2.17.0

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '${{ env.GO_VERSION }}' }
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci && npm run build
        working-directory: ui
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-${GITHUB_SHA::7}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  macos:
    needs: [test, version]
    runs-on: macos-latest
    outputs:
      notarized: ${{ steps.release.outputs.notarized == 'true' }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '${{ env.GO_VERSION }}' }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - name: Версия в метаданных приложения
        run: |
          sed -i '' "s/\"productVersion\": \"[^\"]*\"/\"productVersion\": \"${VERSION%%-*}\"/" desktop/wails.json
      - name: Сборка universal (arm64 + x86_64)
        working-directory: desktop
        env:
          MACOSX_DEPLOYMENT_TARGET: '13.0'
        run: go run $WAILS build -platform darwin/universal -clean -ldflags "-X main.version=${VERSION}"
      # Подпись Developer ID и нотаризация Apple: тогда macOS открывает приложение без предупреждений.
      # Секреты отдаём только релизным сборкам (теги и ручной запуск), PR их не видят.
      # Если секретов нет, package.sh делает ad-hoc подпись, а в релизных заметках остаётся инструкция.
      - name: Подпись Developer ID, нотаризация, DMG и ZIP
        id: release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          RELEASE_BUILD: '1'
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: packaging/macos/package.sh desktop/build/bin/Siphon.app dist
      - name: Ad-hoc подпись, DMG и ZIP
        if: steps.release.outcome == 'skipped'
        run: packaging/macos/package.sh desktop/build/bin/Siphon.app dist
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: dist/*, if-no-files-found: error }

  windows:
    needs: [test, version]
    runs-on: windows-latest
    defaults:
      run: { shell: bash }
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '${{ env.GO_VERSION }}' }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - name: Версия в метаданных приложения
        run: |
          sed -i "s/\"productVersion\": \"[^\"]*\"/\"productVersion\": \"${VERSION%%-*}\"/" desktop/wails.json
      - name: Сборка
        working-directory: desktop
        run: go run $WAILS build -platform windows/amd64 -clean -ldflags "-X main.version=${VERSION}"
      - name: ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path desktop/build/bin/Siphon.exe -DestinationPath dist/Siphon-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/*, if-no-files-found: error }

  linux:
    needs: [test, version]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - run: npm ci && npm run build
        working-directory: ui
      - name: Сборка в Docker (GTK3 + WebKitGTK 4.1)
        run: |
          docker build --platform linux/amd64 -f desktop/Dockerfile \
            --build-arg VERSION="${VERSION}" --output type=local,dest=out .
      - name: Архив
        run: |
          d=Siphon-Linux-x64
          mkdir -p dist "$d"
          install -m755 out/siphon "$d/siphon"
          cp desktop/build/appicon.png "$d/siphon.png"
          cp packaging/linux/siphon.desktop packaging/linux/install.sh "$d/"
          chmod +x "$d/install.sh"
          tar -czf "dist/$d.tar.gz" "$d"
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: dist/*, if-no-files-found: error }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Контрольные суммы
        working-directory: dist
        run: sha256sum Siphon-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Релиз
        env:
          GH_TOKEN: ${{ github.token }}
          NOTARIZED: ${{ needs.macos.outputs.notarized }}
        run: |
          if [[ "$NOTARIZED" == true ]]; then
            ru='**macOS:** откройте `.dmg` и перетащите Siphon в «Программы». Приложение подписано Developer ID и нотаризовано Apple.'
            en='**macOS:** open the `.dmg` and drag Siphon to Applications. The app is signed with Developer ID and notarized by Apple.'
          else
            ru='**macOS:** откройте `.dmg`, перетащите Siphon в «Программы». Если macOS пишет «повреждено» или «неизвестный разработчик» — см. [README](https://github.com/mixelka75/siphon/blob/main/README.md#macos).'
            en='**macOS:** open the `.dmg`, drag Siphon to Applications. If macOS says "damaged" / "unidentified developer" see the [README](https://github.com/mixelka75/siphon/blob/main/README.en.md#macos).'
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Siphon ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag \
            --notes-file <(printf '%s\n' "$ru" '' "$en")
